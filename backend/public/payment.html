<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>999x Payment</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#170020;color:#fff;font-family:Inter,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}.wrap{width:min(460px,100%);padding:24px 16px 40px}.card{background:#240535;border:1px solid #5c1675;border-radius:22px;padding:22px;box-shadow:0 12px 40px #0008}.brand{text-align:center;font-size:24px;font-weight:900}.muted{color:#b9a8c2}.amount{text-align:center;font-size:38px;font-weight:900;margin:12px 0}.upi{text-align:center;background:#170020;border:1px solid #6d2088;border-radius:14px;padding:14px;margin:18px 0}.qr{width:230px;height:230px;background:#fff;border-radius:16px;padding:10px;display:block;margin:16px auto}.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer}.pay{background:#00e676;color:#07120b}.submit{background:#fff;color:#4d1264}.input{width:100%;padding:14px;border-radius:12px;border:1px solid #6d2088;background:#170020;color:#fff;font-size:18px;letter-spacing:2px;margin:10px 0 14px}.status{text-align:center;padding:12px;border-radius:12px;background:#311044;margin-top:14px}.hidden{display:none}.small{font-size:12px;color:#a993ad;text-align:center;margin-top:12px}
</style>
</head>
<body><main class="wrap"><section class="card">
<div class="brand">999x</div><div class="muted" style="text-align:center">Secure UPI payment</div>
<div id="loading" class="status">Loading payment details…</div>
<div id="content" class="hidden">
<div class="amount" id="amount">₹0</div>
<div class="upi"><div class="muted">Pay to UPI ID</div><strong id="upi">—</strong><div class="muted" id="merchant"></div></div>
<img id="qr" class="qr" alt="UPI QR">
<a id="payLink" class="btn pay" style="display:block;text-align:center;text-decoration:none">OPEN UPI APP</a>
<p class="small">Pay the exact amount shown above. After payment, enter the 12-digit UTR/Reference number below.</p>
<hr style="border:0;border-top:1px solid #ffffff18;margin:22px 0">
<div style="font-weight:800">Submit UTR</div>
<input id="utr" class="input" inputmode="numeric" maxlength="12" placeholder="12-digit UTR / reference">
<button id="submit" class="btn submit">SUBMIT UTR</button>
<div id="status" class="status hidden"></div>
</div></section></main>
<script>
const qs=new URLSearchParams(location.search),depositId=qs.get('depositId'),token=qs.get('token');
const $=id=>document.getElementById(id);
async function boot(){
 if(!depositId||!token){$('loading').textContent='Invalid payment link.';return}
 try{
  const r=await fetch('/api/deposits/payment/'+encodeURIComponent(depositId)+'?token='+encodeURIComponent(token));
  const j=await r.json(); if(!r.ok||j.status!=='success') throw new Error(j.message||'Payment link expired');
  const d=j.data;$('amount').textContent='₹'+Number(d.amountRupees).toLocaleString('en-IN',{minimumFractionDigits:2});$('upi').textContent=d.upiId;$('merchant').textContent=d.merchantName;
  $('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=460x460&margin=8&data='+encodeURIComponent(d.qrData);
  $('payLink').href=d.qrData;$('loading').classList.add('hidden');$('content').classList.remove('hidden');
  if(d.status==='UTR_SUBMITTED') show('UTR already submitted. Waiting for admin verification.');
 }catch(e){$('loading').textContent=e.message}
}
function show(t){$('status').textContent=t;$('status').classList.remove('hidden')}
$('submit').onclick=async()=>{const utr=$('utr').value.trim();if(!/^\d{12}$/.test(utr)){show('Enter exactly 12 numeric digits.');return} $('submit').disabled=true;try{const r=await fetch('/api/deposits/payment/'+encodeURIComponent(depositId)+'/utr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,utr})});const j=await r.json();if(!r.ok)throw new Error(j.message||'Unable to submit UTR');show(j.message||'UTR submitted. Pending admin verification.');$('utr').disabled=true}catch(e){show(e.message);$('submit').disabled=false}};
boot();
</script></body></html>
