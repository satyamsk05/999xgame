<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8ff">
<title>999xgame • UPI Payment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f7f8ff;color:#14172b;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center}
.page{width:100%;max-width:620px;padding:18px 18px 30px}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 18px}
.logo{font-size:24px;font-weight:900;letter-spacing:-1px}
.logo span{background:linear-gradient(90deg,#5424d8,#7d4cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.secure{font-size:13px;font-weight:700;color:#69708b;display:flex;gap:7px;align-items:center}
.shield{width:28px;height:28px;border-radius:50%;background:#e9fbf2;color:#12ad65;display:grid;place-items:center}
.card{background:#fff;border:1px solid #e5e7ef;border-radius:28px;padding:28px 26px 24px;box-shadow:0 18px 50px rgba(30,34,70,.09)}
.center{text-align:center}
.muted{color:#69708b}
.amount{font-size:56px;line-height:1.05;font-weight:900;letter-spacing:-2.5px;margin:8px 0 18px}
.timer{width:max-content;margin:0 auto 24px;padding:11px 22px;border-radius:999px;background:#f0efff;color:#5b42c8;font-size:16px;font-weight:700}
.timer strong{font-size:19px;margin-left:7px}
.timer.expired{background:#fff0f1;color:#d63b52}
.qr-wrap{display:flex;justify-content:center;margin:4px auto 18px}
.qr-box{width:min(330px,78vw);aspect-ratio:1;background:#fff;border-radius:24px;padding:14px;box-shadow:0 10px 28px rgba(20,24,50,.08);border:1px solid #edf0f6}
.qr{width:100%;height:100%;object-fit:contain}
.upi-box{background:#f3f5ff;border-radius:20px;padding:16px 18px;text-align:center;margin-bottom:18px}
.upi-label{font-size:13px;color:#69708b;margin-bottom:5px}
.upi-row{display:flex;align-items:center;justify-content:center;gap:10px}
.upi{font-size:20px;font-weight:800;word-break:break-all}
.copy{width:34px;height:34px;border:0;border-radius:10px;background:#fff;color:#5d48c9;cursor:pointer}
.merchant{font-size:13px;color:#78809a;margin-top:6px}
.pay-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.pay{border:0;border-radius:16px;padding:15px 10px;font-size:16px;font-weight:800;min-height:56px;text-decoration:none;display:flex;justify-content:center;align-items:center;gap:9px}
.gpay{background:#eaf0ff;color:#17204a}
.phonepe{background:#eee8ff;color:#5427a9}
.icon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff}
.divider{display:flex;align-items:center;gap:12px;color:#9298aa;font-size:12px;font-weight:700;margin:8px 0 18px}
.divider:before,.divider:after{content:"";height:1px;background:#e7e9f0;flex:1}
.label{font-size:15px;font-weight:800;margin-bottom:8px}
.input-wrap{display:flex;align-items:center;gap:10px;border:1.5px solid #d7dbe6;border-radius:15px;padding:0 14px;height:58px;margin-bottom:12px}
.hash{width:30px;height:30px;border-radius:9px;background:#f0f2fa;display:grid;place-items:center;font-weight:800;color:#626a82}
.input{border:0;outline:0;flex:1;height:100%;font:600 16px Inter;letter-spacing:1px}
.submit{width:100%;height:58px;border:0;border-radius:16px;background:linear-gradient(100deg,#5b35d5,#7041df);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.submit:disabled{opacity:.55;cursor:not-allowed}
.status{margin-top:14px;padding:12px 14px;border-radius:13px;background:#eef9f2;color:#188b55;font-size:13px;font-weight:600;text-align:center}
.error{background:#fff0f2;color:#c9344e}
.hidden{display:none !important}
.success-screen{position:fixed;inset:0;background:rgba(247,248,255,.98);z-index:20;display:grid;place-items:center;text-align:center;padding:24px}
.success-box{background:#fff;border-radius:30px;padding:40px 28px;box-shadow:0 20px 60px rgba(30,34,70,.15);max-width:430px;width:100%}
.success-circle{width:94px;height:94px;margin:0 auto 20px;border-radius:50%;background:#e9fbf2;color:#12ad65;display:grid;place-items:center;font-size:54px;font-weight:900;animation:pop .55s cubic-bezier(.2,.9,.3,1.3)}
.success-title{font-size:27px;font-weight:900;margin-bottom:8px}
.success-text{color:#69708b;line-height:1.5}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@media(max-width:420px){.page{padding:12px}.card{padding:23px 16px 20px}.amount{font-size:48px}.qr-box{width:min(300px,82vw);padding:11px}.upi{font-size:18px}.pay{font-size:14px}}
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <div class="logo">999x<span>game</span></div>
    <div class="secure"><span class="shield">✓</span>Secure UPI Payment</div>
  </header>
  <section class="card">
    <div id="loading" class="center muted">Loading secure payment…</div>
    <div id="content" class="hidden">
      <div class="center muted">Amount to Pay</div>
      <div class="amount center" id="amount">₹0.00</div>
      <div id="timer" class="timer">Complete payment in <strong id="countdown">10:00</strong></div>
      <div class="qr-wrap">
        <div class="qr-box"><img id="qr" class="qr" alt="UPI QR"></div>
      </div>
      <div class="upi-box">
        <div class="upi-label">UPI ID</div>
        <div class="upi-row">
          <strong id="upi" class="upi">—</strong>
          <button id="copy" class="copy" type="button" title="Copy UPI ID">⧉</button>
        </div>
        <div id="merchant" class="merchant"></div>
      </div>
      <div class="pay-row">
        <a id="gpay" class="pay gpay" href="#"><span class="icon">G</span>Google Pay</a>
        <a id="phonepe" class="pay phonepe" href="#"><span class="icon">पे</span>PhonePe</a>
      </div>
      <div class="divider">OR</div>
      <div class="label">Enter UTR / Reference Number</div>
      <div class="input-wrap">
        <span class="hash">#</span>
        <input id="utr" class="input" inputmode="numeric" maxlength="12" placeholder="12-digit UTR number">
      </div>
      <button id="submit" class="submit">SUBMIT UTR →</button>
      <div id="status" class="status hidden"></div>
    </div>
  </section>
</main>

<div id="successScreen" class="success-screen hidden">
  <div class="success-box">
    <div class="success-circle">✓</div>
    <div class="success-title">Deposit Successful</div>
    <div id="successText" class="success-text">Your deposit has been approved and your wallet has been credited.</div>
    <button type="button" class="submit" style="margin-top:22px;height:52px;" onclick="window.close()">Return to Game</button>
  </div>
</div>

<script>
const q = new URLSearchParams(location.search);
const depositId = q.get('depositId');
const token = q.get('token');
const $ = id => document.getElementById(id);
let timerId = null;
let pollId = null;
let seconds = 600;
let currentStatus = '';

function show(msg, error = false) {
  $('status').textContent = msg;
  $('status').classList.remove('hidden');
  $('status').classList.toggle('error', error);
}

function lockForm() {
  $('utr').disabled = true;
  $('submit').disabled = true;
}

function renderStatus(status, amount) {
  currentStatus = status;
  if (status === 'CONFIRMED') {
    lockForm();
    if (timerId) clearInterval(timerId);
    $('successText').textContent = `₹${Number(amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} has been approved and credited to your wallet.`;
    $('successScreen').classList.remove('hidden');
    return;
  }
  $('successScreen').classList.add('hidden');
  if (status === 'REJECTED' || status === 'EXPIRED') {
    lockForm();
    if (timerId) clearInterval(timerId);
    show('This deposit was rejected. Please create a new deposit request.', true);
    return;
  }
  if (status === 'UTR_SUBMITTED') {
    lockForm();
    show('UTR submitted successfully. Waiting for admin verification.');
  }
}

async function getStatus() {
  try {
    const r = await fetch('/api/deposits/payment/' + encodeURIComponent(depositId) + '?token=' + encodeURIComponent(token), { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || j.status !== 'success') return;
    renderStatus(j.data?.status, j.data?.amountRupees);
  } catch (_) {}
}

function startPolling() {
  if (pollId) clearInterval(pollId);
  pollId = setInterval(getStatus, 2000);
}

function startTimer() {
  timerId = setInterval(() => {
    seconds = Math.max(0, seconds - 1);
    $('countdown').textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
    if (seconds === 0) {
      clearInterval(timerId);
      $('timer').classList.add('expired');
      $('timer').firstChild.textContent = 'Payment window expired ';
      lockForm();
      show('Payment window expired. Please create a new deposit request.', true);
    }
  }, 1000);
}

async function boot() {
  if (!depositId || !token) {
    $('loading').textContent = 'Invalid payment link.';
    return;
  }
  try {
    const r = await fetch('/api/deposits/payment/' + encodeURIComponent(depositId) + '?token=' + encodeURIComponent(token), { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || j.status !== 'success') throw new Error(j.message || 'Payment link expired or invalid.');
    const d = j.data || {};
    const amount = Number(d.amountRupees);
    if (!d.upiId || !Number.isFinite(amount) || amount <= 0) throw new Error('Invalid payment details. Please create a new deposit request.');
    const qr = d.qrData || `upi://pay?pa=${encodeURIComponent(d.upiId)}&pn=${encodeURIComponent(d.merchantName || '999xgame')}&am=${amount.toFixed(2)}&cu=INR&tn=${encodeURIComponent(d.depositId || depositId)}`;
    $('amount').textContent = '₹' + amount.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    $('upi').textContent = d.upiId;
    $('merchant').textContent = d.merchantName || '999xgame';
    $('qr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=10&data=' + encodeURIComponent(qr);
    $('gpay').href = qr;
    $('phonepe').href = qr;
    $('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(d.upiId);
        show('UPI ID copied.');
      } catch (_) {
        show('Copy the UPI ID manually.', true);
      }
    };
    $('loading').classList.add('hidden');
    $('content').classList.remove('hidden');
    renderStatus(d.status, amount);
    if (d.status === 'PENDING') startTimer();
    startPolling();
  } catch (e) {
    $('loading').textContent = e.message || 'Could not load payment details.';
    $('loading').classList.add('error');
  }
}

$('utr').addEventListener('input', () => {
  $('utr').value = $('utr').value.replace(/\D/g, '').slice(0, 12);
});

$('submit').onclick = async () => {
  const utr = $('utr').value.trim();
  if (!/^\d{12}$/.test(utr)) {
    show('Enter exactly 12 numeric digits.', true);
    return;
  }
  $('submit').disabled = true;
  $('submit').textContent = 'SUBMITTING…';
  try {
    const r = await fetch('/api/deposits/payment/' + encodeURIComponent(depositId) + '/utr', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, utr })
    });
    const j = await r.json();
    if (!r.ok || j.status !== 'success') throw new Error(j.message || 'Unable to submit UTR.');
    if (timerId) clearInterval(timerId);
    renderStatus('UTR_SUBMITTED', j.data?.amountRupees);
    $('submit').textContent = 'UTR SUBMITTED ✓';
    startPolling();
  } catch (e) {
    show(e.message || 'Unable to submit UTR.', true);
    $('submit').disabled = false;
    $('submit').textContent = 'SUBMIT UTR →';
  }
};

boot();
</script>
</body>
</html>
