<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#170020">
<title>999x Payment</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#170020;color:#fff;font-family:Inter,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}.wrap{width:min(460px,100%);padding:24px 16px 40px}.card{background:#240535;border:1px solid #5c1675;border-radius:22px;padding:22px;box-shadow:0 12px 40px #0008}.brand{text-align:center;font-size:24px;font-weight:900}.muted{color:#b9a8c2}.amount{text-align:center;font-size:38px;font-weight:900;margin:12px 0}.upi{text-align:center;background:#170020;border:1px solid #6d2088;border-radius:14px;padding:14px;margin:18px 0}.qr{width:230px;height:230px;background:#fff;border-radius:16px;padding:10px;display:block;margin:16px auto}.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer}.pay{background:#00e676;color:#07120b}.submit{background:#fff;color:#4d1264}.input{width:100%;padding:14px;border-radius:12px;border:1px solid #6d2088;background:#170020;color:#fff;font-size:18px;letter-spacing:2px;margin:10px 0 14px}.status{text-align:center;padding:12px;border-radius:12px;background:#311044;margin-top:14px}.hidden{display:none}.small{font-size:12px;color:#a993ad;text-align:center;margin-top:12px}.error{background:#4a1020;color:#ffd7df}
</style>
</head>
<body><main class="wrap"><section class="card">
<div class="brand">999x</div><div class="muted" style="text-align:center">Secure UPI payment</div>
<div id="loading" class="status">Loading payment details…</div>
<div id="content" class="hidden">
<div class="amount" id="amount">₹0.00</div>
<div class="upi"><div class="muted">Pay to UPI ID</div><strong id="upi">—</strong><div class="muted" id="merchant"></div></div>
<img id="qr" class="qr" alt="UPI QR code">
<a id="payLink" class="btn pay" style="display:block;text-align:center;text-decoration:none">OPEN UPI APP</a>
<p class="small">Pay the exact amount shown above. After payment, enter the 12-digit UTR/Reference number below.</p>
<hr style="border:0;border-top:1px solid #ffffff18;margin:22px 0">
<div style="font-weight:800">Submit UTR</div>
<input id="utr" class="input" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="12-digit UTR / reference">
<button id="submit" class="btn submit">SUBMIT UTR</button>
<div id="status" class="status hidden"></div>
</div></section></main>
<script>
const qs=new URLSearchParams(location.search),depositId=qs.get('depositId'),token=qs.get('token');
const $=id=>document.getElementById(id);
function show(t,error=false){$('status').textContent=t;$('status').classList.remove('hidden');$('status').classList.toggle('error',error)}
async function boot(){
 if(!depositId||!token){$('loading').textContent='Invalid payment link.';return}
 try{
  const r=await fetch('/api/deposits/payment/'+encodeURIComponent(depositId)+'?token='+encodeURIComponent(token),{cache:'no-store'});
  let j={};try{j=await r.json()}catch(_){throw new Error('Payment service returned an invalid response.')}
  if(!r.ok||j.status!=='success') throw new Error(j.message||'Payment link expired or is invalid.');
  const d=j.data||{};
  if(!d.upiId) throw new Error('UPI payment is temporarily unavailable. Please contact support.');
  const amount=Number(d.amountRupees);
  if(!Number.isFinite(amount)||amount<=0) throw new Error('Invalid deposit amount. Please create a new deposit request.');
  $('amount').textContent='₹'+amount.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  $('upi').textContent=d.upiId;
  $('merchant').textContent=d.merchantName||'999x';
  $('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=460x460&margin=8&data='+encodeURIComponent(d.qrData||'');
  $('qr').onerror=()=>show('QR could not be loaded. You can still use the UPI ID above.',true);
  if(d.qrData) $('payLink').href=d.qrData; else $('payLink').style.display='none';
  $('loading').classList.add('hidden');$('content').classList.remove('hidden');
  if(d.status==='UTR_SUBMITTED'){show('UTR already submitted. Waiting for admin verification.');$('utr').disabled=true;$('submit').disabled=true;}
 }catch(e){$('loading').textContent=e.message||'Could not load payment details.';$('loading').classList.add('error')}
}
$('utr').addEventListener('input',()=>{$('utr').value=$('utr').value.replace(/\D/g,'').slice(0,12)});
$('submit').onclick=async()=>{
 const utr=$('utr').value.trim();
 if(!/^\d{12}$/.test(utr)){show('Enter exactly 12 numeric digits.',true);return}
 $('submit').disabled=true;$('submit').textContent='SUBMITTING…';
 try{
  const r=await fetch('/api/deposits/payment/'+encodeURIComponent(depositId)+'/utr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,utr})});
  let j={};try{j=await r.json()}catch(_){throw new Error('Server returned an invalid response.')}
  if(!r.ok||j.status!=='success') throw new Error(j.message||'Unable to submit UTR.');
  show(j.message||'UTR submitted. Pending admin verification.');
  $('utr').disabled=true;$('submit').textContent='UTR SUBMITTED';
 }catch(e){show(e.message||'Unable to submit UTR.',true);$('submit').disabled=false;$('submit').textContent='SUBMIT UTR'}
};
boot();
</script></body></html>
