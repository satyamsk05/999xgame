<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8ff">
<title>999xgame • UPI Payment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f7f8ff;color:#14172b;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{display:flex;justify-content:center}.page{width:100%;max-width:620px;padding:18px 18px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 18px}.logo{font-size:24px;font-weight:900;letter-spacing:-1px}.logo span{background:linear-gradient(90deg,#5424d8,#7d4cff);-webkit-background-clip:text;background-clip:text;color:transparent}.top-right{font-size:13px;font-weight:700;color:#69708b;display:flex;align-items:center;gap:7px}.shield{width:28px;height:28px;border-radius:50%;background:#e9fbf2;color:#12ad65;display:grid;place-items:center;font-size:15px}.card{background:rgba(255,255,255,.97);border:1px solid #e5e7ef;border-radius:28px;padding:28px 26px 24px;box-shadow:0 18px 50px rgba(30,34,70,.09)}.title{font-size:14px;color:#69708b;text-align:center;font-weight:600}.amount{text-align:center;font-size:56px;line-height:1.05;font-weight:900;letter-spacing:-2.5px;margin:8px 0 18px}.timer{width:max-content;max-width:100%;margin:0 auto 24px;padding:11px 22px;border-radius:999px;background:#f0efff;color:#5b42c8;font-size:16px;font-weight:700}.timer strong{font-size:19px;margin-left:7px;letter-spacing:.5px}.timer.expired{background:#fff0f1;color:#d63b52}.qr-wrap{display:flex;justify-content:center;margin:4px auto 18px}.qr-box{width:min(330px,78vw);aspect-ratio:1/1;background:#fff;border-radius:24px;padding:14px;box-shadow:0 10px 28px rgba(20,24,50,.08);border:1px solid #edf0f6}.qr{width:100%;height:100%;display:block;object-fit:contain}.upi-box{background:#f3f5ff;border-radius:20px;padding:16px 18px;text-align:center;margin:0 0 18px}.upi-label{font-size:13px;color:#69708b;margin-bottom:5px}.upi-row{display:flex;align-items:center;justify-content:center;gap:10px}.upi{font-size:20px;font-weight:800;letter-spacing:-.4px;word-break:break-all}.copy{width:34px;height:34px;border:0;border-radius:10px;background:#fff;color:#5d48c9;cursor:pointer;font-size:16px}.merchant{font-size:13px;color:#78809a;margin-top:6px}.pay-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}.pay-btn{border:0;border-radius:16px;padding:15px 10px;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;min-height:56px;text-decoration:none}.gpay{background:#eaf0ff;color:#17204a}.phonepe{background:#eee8ff;color:#5427a9}.pay-icon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:15px}.divider{display:flex;align-items:center;gap:12px;color:#9298aa;font-size:12px;font-weight:700;margin:8px 0 18px}.divider:before,.divider:after{content:"";height:1px;background:#e7e9f0;flex:1}.utr-label{font-size:15px;font-weight:800;margin-bottom:8px}.input-wrap{display:flex;align-items:center;gap:10px;border:1.5px solid #d7dbe6;background:#fff;border-radius:15px;padding:0 14px;margin-bottom:12px;height:58px}.hash{width:30px;height:30px;border-radius:9px;background:#f0f2fa;color:#626a82;display:grid;place-items:center;font-weight:800}.input{border:0;outline:0;background:transparent;flex:1;height:100%;font:600 16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15182a;letter-spacing:1px}.input::placeholder{color:#9ca2b4;letter-spacing:0}.submit{width:100%;height:58px;border:0;border-radius:16px;background:linear-gradient(100deg,#5b35d5,#7041df);color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 10px 22px rgba(94,57,214,.22)}.submit:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}.note{text-align:center;color:#747b91;font-size:12px;line-height:1.5;margin:16px 8px 0}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;color:#626a82;font-size:11px;font-weight:700;text-align:center}.feature{padding:9px 3px}.feature b{display:block;color:#6842d8;font-size:15px;margin-bottom:4px}.status{margin-top:14px;padding:12px 14px;border-radius:13px;background:#eef9f2;color:#188b55;font-size:13px;font-weight:600;text-align:center}.error{background:#fff0f2;color:#c9344e}.hidden{display:none}.loading{text-align:center;padding:30px;color:#69708b;font-size:14px}@media(max-width:420px){.page{padding-left:12px;padding-right:12px}.card{padding:23px 16px 20px;border-radius:24px}.amount{font-size:48px}.qr-box{width:min(300px,82vw);padding:11px}.upi{font-size:18px}.pay-btn{font-size:14px}.features{font-size:10px}}
</style>
</head>
<body><main class="page">
<header class="top"><div class="logo">999x<span>game</span></div><div class="top-right"><span class="shield">✓</span><span>Secure UPI Payment</span></div></header>
<section class="card">
<div id="loading" class="loading">Loading secure payment…</div>
<div id="content" class="hidden">
<div class="title">Amount to Pay</div>
<div class="amount" id="amount">₹0.00</div>
<div id="timer" class="timer">Complete payment in <strong id="countdown">10:00</strong></div>
<div class="qr-wrap"><div class="qr-box"><img id="qr" class="qr" alt="UPI QR code"></div></div>
<div class="upi-box"><div class="upi-label">UPI ID</div><div class="upi-row"><strong id="upi" class="upi">—</strong><button id="copy" class="copy" type="button" aria-label="Copy UPI ID">⧉</button></div><div id="merchant" class="merchant"></div></div>
<div class="pay-row"><a id="gpay" class="pay-btn gpay" href="#"><span class="pay-icon">G</span>Google Pay</a><a id="phonepe" class="pay-btn phonepe" href="#"><span class="pay-icon">पे</span>PhonePe</a></div>
<div class="divider">OR</div>
<div class="utr-label">Enter UTR / Reference Number</div>
<div class="input-wrap"><span class="hash">#</span><input id="utr" class="input" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="12-digit UTR number"></div>
<button id="submit" class="submit" type="button">SUBMIT UTR <span style="margin-left:8px">→</span></button>
<div id="status" class="status hidden"></div>
<p class="note">After successful payment, enter the 12-digit UTR number to verify your deposit.</p>
</div></section>
<div class="features"><div class="feature"><b>⚡</b>Instant Processing</div><div class="feature"><b>🔒</b>100% Secure</div><div class="feature"><b>✓</b>Manual Verification</div></div>
</main>
<script>
const qs=new URLSearchParams(location.search),depositId=qs.get('depositId'),token=qs.get('token');
const $=id=>document.getElementById(id);let timerSeconds=600,timerId=null;
function show(t,error=false){$('status').textContent=t;$('status').classList.remove('hidden');$('status').classList.toggle('error',error)}
function startTimer(){timerId=setInterval(()=>{timerSeconds--;if(timerSeconds<0)timerSeconds=0;const m=String(Math.floor(timerSeconds/60)).padStart(2,'0'),s=String(timerSeconds%60).padStart(2,'0');$('countdown').textContent=m+':'+s;if(timerSeconds===0){clearInterval(timerId);$('timer').classList.add('expired');$('timer').firstChild.textContent='Payment window expired ';$('submit').disabled=true;$('utr').disabled=true;show('Payment window expired. Please create a new deposit request.',true)}},1000)}
async function boot(){
 if(!depositId||!token){$('loading').textContent='Invalid payment link.';return}
 try{const r=await fetch('/api/deposits/payment/'+encodeURIComponent(depositId)+'?token='+encodeURIComponent(token),{cache:'no-store'});let j={};try{j=await r.json()}catch(_){throw new Error('Payment service returned an invalid response.')};if(!r.ok||j.status!=='success')throw new Error(j.message||'Payment link expired or is invalid.');const d=j.data||{},amount=Number(d.amountRupees);if(!d.upiId)throw new Error('UPI payment is temporarily unavailable. Please contact support.');if(!Number.isFinite(amount)||amount<=0)throw new Error('Invalid deposit amount. Please create a new deposit request.');const upi=d.upiId,merchant=d.merchantName||'999xgame',qr=d.qrData||('upi://pay?pa='+encodeURIComponent(upi)+'&pn='+encodeURIComponent(merchant)+'&am='+amount.toFixed(2)+'&cu=INR&tn='+encodeURIComponent(d.depositId||depositId));$('amount').textContent='₹'+amount.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});$('upi').textContent=upi;$('merchant').textContent=merchant;$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=10&data='+encodeURIComponent(qr);$('qr').onerror=()=>show('QR could not be loaded. You can still pay using the UPI ID above.',true);$('gpay').href=qr;$('phonepe').href=qr;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(upi);show('UPI ID copied.')}catch(_){show('Copy is not available. Please copy the UPI ID manually.',true)}};$('loading').classList.add('hidden');$('content').classList.remove('hidden');if(d.status==='UTR_SUBMITTED'){show('UTR already submitted. Waiting for admin verification.');$('utr').disabled=true;$('submit').disabled=true}else startTimer()}catch(e){$('loading').textContent=e.message||'Could not load payment details.';$('loading').classList.add('error')}}
$('utr').addEventListener('input',()=>{$('utr').value=$('utr').value.replace(/\D/g,'').slice(0,12)});
$('submit').onclick=async()=>{const utr=$('utr').value.trim();if(!/^\d{12}$/.test(utr)){show('Enter exactly 12 numeric digits.',true);return}$('submit').disabled=true;$('submit').textContent='SUBMITTING…';try{const r=await fetch('/api/deposits/payment/'+encodeURIComponent(depositId)+'/utr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,utr})});let j={};try{j=await r.json()}catch(_){throw new Error('Server returned an invalid response.')};if(!r.ok||j.status!=='success')throw new Error(j.message||'Unable to submit UTR.');if(timerId)clearInterval(timerId);show(j.message||'UTR submitted. Pending admin verification.');$('utr').disabled=true;$('submit').textContent='UTR SUBMITTED ✓'}catch(e){show(e.message||'Unable to submit UTR.',true);$('submit').disabled=false;$('submit').textContent='SUBMIT UTR →'}};
boot();
</script></body></html>
