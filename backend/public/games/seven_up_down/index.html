<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>InGames - 7 Up Down Dice Game</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Socket.IO Client Library -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    if (typeof window.io === 'undefined') {
      var script = document.createElement('script');
      script.src = 'https://cdn.socket.io/4.7.5/socket.io.min.js';
      document.head.appendChild(script);
    }
  </script>

  <!-- Global Dialog Suppressors -->
  <script>
    window.alert = function(msg) { console.warn('[Game Alert Suppressed]:', msg); };
    window.confirm = function() { return true; };
    window.prompt = function() { return null; };
  </script>

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="./css/style.css">
  <style>
    * {
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      outline: none !important;
    }
    *:focus, *:active, *:focus-visible, button, div, a, canvas {
      outline: none !important;
      -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
      -webkit-focus-ring-color: transparent !important;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Top Header Bar (Settings Button & Network Ping) -->
    <div class="top-header-bar">
      <button class="settings-btn-wrap" id="btnSettings" type="button">
        <div class="settings-btn-circle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </div>
        <span class="settings-btn-label">Settings</span>
      </button>

      <div class="header-ping-pill" id="headerPingPill">
        <svg class="wifi-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3C7.95 3 4.21 4.34 1.2 6.6L3 9c2.47-1.87 5.56-3 9-3s6.53 1.13 9 3l1.8-2.4C19.79 4.34 16.05 3 12 3zm0 6c-2.73 0-5.26.9-7.3 2.4L6.5 13.8C8.07 12.67 9.96 12 12 12s3.93.67 5.5 1.8l1.8-2.4C17.26 9.9 14.73 9 12 9zm0 6c-1.4 0-2.7.46-3.76 1.23L12 21l3.76-4.77C14.7 15.46 13.4 15 12 15z"/>
        </svg>
        <span id="pingValText">194ms</span>
      </div>
    </div>

    <!-- Last 100 Rounds Card -->
    <div class="history-card">
      <div class="history-header">
        <span>Last 100 Rounds</span>
        <div class="legend-row">
          <div class="dot-item"><div class="dot dot-red"></div>2-6</div>
          <div class="dot-item"><div class="dot dot-blue"></div>7</div>
          <div class="dot-item"><div class="dot dot-green"></div>8-12</div>
        </div>
      </div>
      <div class="history-ribbon" id="historyRibbon">
        <!-- Injected by HistoryPanel UI Component -->
      </div>
    </div>

    <!-- Center Stage & Active Players -->
    <div class="stage-row">
      <!-- Top 3 Bettors Vertical Stack -->
      <div class="players-col" id="playersCol">
        <!-- Injected by PlayersPanel UI Component -->
      </div>

      <!-- Glowing Green Disc Center Dome -->
      <div class="glass-dome-wrap">
        <div class="dome-pedestal">
          <div class="dice-cube" id="dice1">4</div>
          <div class="dice-cube" id="dice2">3</div>
        </div>
      </div>

      <!-- Circular Timer Ring -->
      <div class="timer-ring-wrap">
        <div class="timer-text-val" id="timerText">12</div>
      </div>
    </div>

    <!-- Middle Control / Table Bet Bar -->
    <div class="mid-control-bar">
      <div class="pill-info">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
        <span>32</span>
      </div>
      <div class="pill-total-bet">
        <span class="total-bet-title">Total Table Bet Amount</span>
        <span class="total-bet-val" id="totalTableBetVal">₹0.00</span>
      </div>
    </div>

    <!-- Main 3D Betting Board (Blue Container with 3 Large Tiles) -->
    <div class="main-betting-board" id="mainBetsGrid">
      <!-- 7 LUCKY (Top Large Blue Tile) -->
      <div class="bet-tile-top" id="btnBetSeven">
        <div class="tile-user-badge" id="badgeSeven"></div>
        <div class="tile-odds-text">1 : 4</div>
      </div>

      <!-- Bottom 2 Tiles Row (Green DOWN 1:1, Red UP 1:1) -->
      <div class="bet-tiles-row">
        <!-- 2 - 6 DOWN (Bottom Left Green Tile) -->
        <div class="bet-tile-green" id="btnBetDown">
          <div class="tile-user-badge" id="badgeDown"></div>
          <div class="tile-odds-text">1 : 1</div>
        </div>

        <!-- 8 - 12 UP (Bottom Right Red Tile) -->
        <div class="bet-tile-red" id="btnBetUp">
          <div class="tile-user-badge" id="badgeUp"></div>
          <div class="tile-odds-text">1 : 1</div>
        </div>
      </div>
    </div>

    <!-- Radial Chip Selector Popup -->
    <div class="radial-chips-popup" id="chipRadialPopup">
      <div class="pop-chip" data-val="10"><img src="./assets/chips/10.svg" alt="10 Chip" /></div>
      <div class="pop-chip" data-val="50"><img src="./assets/chips/50.svg" alt="50 Chip" /></div>
      <div class="pop-chip" data-val="100"><img src="./assets/chips/100.svg" alt="100 Chip" /></div>
      <div class="pop-chip" data-val="500"><img src="./assets/chips/500.svg" alt="500 Chip" /></div>
      <div class="pop-chip" data-val="1000"><img src="./assets/chips/1K.svg" alt="1K Chip" /></div>
      <div class="pop-chip" data-val="5000"><img src="./assets/chips/5K.svg" alt="5K Chip" /></div>
    </div>

    <!-- Bottom Player & Betting Bar (Fixed) -->
    <div class="bottom-player-bar">
      <!-- Left User Info & Balance -->
      <div class="player-info-box">
        <img src="/avatars/avatar_1.png" class="player-avatar-circle" onerror="this.src='/avatars/avatar_1.png'" alt="Avatar" />
        <div class="player-details-col">
          <span class="player-name-txt" id="userNameText">REENA</span>
          <span class="player-balance-txt" id="userBalanceText">₹120.00</span>
        </div>
      </div>

      <!-- Center Green Arch & Prominent 3D Chip -->
      <div class="chip-center-anchor" id="mainChipBtn">
        <div class="chip-green-arch"></div>
        <div class="main-chip-face" id="mainChipFace">
          <img src="./assets/chips/10.svg" id="mainChipImg" alt="10 Chip" style="width:100%;height:100%;object-fit:contain;" />
        </div>
      </div>

      <!-- Right "Your Bet" Info -->
      <div class="your-bet-box">
        <span>Your Bet</span>
        <span class="your-bet-val" id="yourBetText">₹0</span>
      </div>
    </div>

    <!-- Win Toast -->
    <div class="win-toast" id="winToast">
      🎉 YOU WON ₹0!
    </div>

    <!-- Game Settings Modal Overlay -->
    <div class="settings-modal-overlay" id="settingsModal">
      <div class="settings-modal-card">
        <div class="modal-handle"></div>

        <div class="modal-header-row">
          <div class="modal-title-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#A78BFA">
              <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
            <span>Game Settings</span>
          </div>
          <button class="modal-close-icon-btn" id="btnCloseSettings" type="button">✕</button>
        </div>

        <!-- Sound Toggle Box -->
        <div class="setting-item-box">
          <div class="setting-item-left">
            <div id="soundIconBox">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="#00E676">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
            </div>
            <div>
              <div class="setting-item-name">Sound Effects</div>
              <div class="setting-item-sub" id="soundStatusText">Sound is Enabled</div>
            </div>
          </div>
          <label class="switch-toggle-btn">
            <input type="checkbox" id="toggleSoundInput" checked>
            <span class="switch-slider"></span>
          </label>
        </div>

        <!-- EXIT MATCH / BACK TO HOME Button -->
        <button class="btn-exit-match-danger" id="btnExitMatch" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
          </svg>
          <span>BACK TO HOME</span>
        </button>
      </div>
    </div>

    <!-- Chip Animation Flying Particles Overlay -->
    <div id="chipAnimationOverlay" class="chip-animation-overlay"></div>

  </div>

  <!-- Entry Script (ES6 Module) -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
