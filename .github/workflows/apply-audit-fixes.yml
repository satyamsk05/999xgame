name: Apply remaining audit fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path

          login = Path('lib/screens/login_screen.dart')
          text = login.read_text()
          old = '''    } catch (e) {\n      // Log error for debugging (visible in flutter logs)\n      debugPrint('[LoginVerify] Error in verification loop: $e');\n      await Future.delayed(const Duration(milliseconds: 1500));\n    }'''
          new = '''    } catch (e) {\n      // Fail closed on permanent/authentication errors. Only transient\n      // transport/server failures are retried.\n      if (e is ApiException) {\n        const retryableStatuses = <int>{0, 408, 429, 500, 502, 503, 504};\n        final status = e.statusCode ?? 0;\n        if (!retryableStatuses.contains(status)) {\n          _isVerifyingActive = false;\n          if (mounted) {\n            setState(() {\n              _isLoading = false;\n              _statusMessage = null;\n              _errorMessage = e.message;\n              _currentStep = 0;\n            });\n          }\n          return;\n        }\n      }\n      debugPrint('[LoginVerify] transient error: $e');\n      await Future.delayed(const Duration(milliseconds: 1500));\n    }'''
          if text.count(old) != 1: raise SystemExit(f'login verify pattern count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''    } catch (_) {\n      // Non-fatal: proceed even if API call fails\n    }\n\n    if (mounted) {'''
          new = '''    } catch (e) {\n      // Onboarding persistence is authoritative state; fail closed on error.\n      if (mounted) {\n        setState(() {\n          _isLoading = false;\n          _errorMessage = e is ApiException ? e.message : 'Could not complete setup. Please try again.';\n        });\n      }\n      return;\n    }\n\n    if (mounted) {'''
          if text.count(old) != 1: raise SystemExit(f'login onboarding pattern count={text.count(old)}')
          login.write_text(text.replace(old, new, 1))

          main = Path('lib/main.dart')
          text = main.read_text().replace("import 'dart:io';\n", '', 1)
          old = '''  void _startNetworkMonitoring() {\n    _networkPingTimer?.cancel();\n    _networkPingTimer = Timer.periodic(const Duration(seconds: 8), (timer) async {\n      if (!mounted || !_isLoggedIn) return;\n      if (kIsWeb) return;\n      try {\n        final result = await InternetAddress.lookup('google.com').timeout(const Duration(seconds: 4));\n        if (result.isNotEmpty && result[0].rawAddress.isNotEmpty) {\n          if (_isOffline && mounted) {\n            setState(() {\n              _isOffline = false;\n            });\n            _fetchUserData();\n          }\n          return;\n        }\n      } catch (_) {\n        if (!_isOffline && mounted) {\n          setState(() {\n            _isOffline = true;\n          });\n        }\n      }\n    });\n  }'''
          new = '''  void _startNetworkMonitoring() {\n    _networkPingTimer?.cancel();\n    _networkPingTimer = Timer.periodic(const Duration(seconds: 8), (timer) async {\n      if (!mounted || !_isLoggedIn) return;\n      final ready = await ApiService.isBackendReady(timeout: const Duration(seconds: 4));\n      if (!mounted) return;\n      if (ready) {\n        if (_isOffline) {\n          setState(() => _isOffline = false);\n          _fetchUserData();\n        }\n      } else if (!_isOffline) {\n        setState(() => _isOffline = true);\n      }\n    });\n  }'''
          if text.count(old) != 1: raise SystemExit(f'main network pattern count={text.count(old)}')
          main.write_text(text.replace(old, new, 1))

          money = Path('lib/core/money/money_paise.dart')
          money.parent.mkdir(parents=True, exist_ok=True)
          money.write_text('''/// Exact monetary value represented as integer paise.\nclass MoneyPaise {\n  const MoneyPaise(this.value);\n\n  final int value;\n\n  factory MoneyPaise.fromRupees(num rupees) {\n    if (!rupees.isFinite || rupees < 0) {\n      throw ArgumentError.value(rupees, 'rupees', 'must be finite and non-negative');\n    }\n    final scaled = rupees * 100;\n    if (scaled.roundToDouble() != scaled) {\n      throw ArgumentError.value(rupees, 'rupees', 'must have at most two decimal places');\n    }\n    return MoneyPaise(scaled.toInt());\n  }\n\n  double get rupees => value / 100.0;\n  String get decimalString => (value / 100).toStringAsFixed(2);\n  Map<String, dynamic> toJson() => {'amountPaise': value};\n\n  @override\n  bool operator ==(Object other) => other is MoneyPaise && other.value == value;\n  @override\n  int get hashCode => value.hashCode;\n  @override\n  String toString() => 'MoneyPaise($value)';\n}\n''')

          wallet = Path('lib/features/wallet/data/wallet_api.dart')
          text = wallet.read_text()
          if "money_paise.dart" not in text:
              text = text.replace("import '../../../core/api/api_client.dart';", "import '../../../core/api/api_client.dart';\nimport '../../../core/money/money_paise.dart';", 1)
          marker = 'class WalletApi {'
          additions = '''class WalletApi {\n  static Future<Map<String, dynamic>> createDepositOrderPaise({\n    required MoneyPaise amount,\n    String paymentMethod = 'UPI',\n  }) async {\n    final res = await ApiClient.post('/deposits', {\n      'amount': amount.rupees,\n      'amountPaise': amount.value,\n      'paymentMethod': paymentMethod,\n    });\n    return res as Map<String, dynamic>;\n  }\n\n  static Future<Map<String, dynamic>> withdrawCashPaise({\n    required MoneyPaise amount,\n    required String upiId,\n    String? idempotencyKey,\n  }) async {\n    final res = await ApiClient.post('/withdrawals', {\n      'amount': amount.rupees,\n      'amountPaise': amount.value,\n      'upiId': upiId,\n      'idempotencyKey': idempotencyKey,\n    });\n    return res as Map<String, dynamic>;\n  }\n'''
          if text.count(marker) != 1: raise SystemExit('WalletApi marker missing')
          wallet.write_text(text.replace(marker, additions, 1))

      - name: Add Flutter CI
        shell: bash
        run: |
          cat > .github/workflows/flutter-tests.yml <<'EOF'
          name: Flutter checks
          on:
            push:
              branches: [main]
            pull_request:
          jobs:
            analyze:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: '3.41.0'
                    channel: stable
                    cache: true
                - run: flutter pub get
                - run: flutter analyze
                - run: flutter test
          EOF

      - name: Commit fixes and remove one-time workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/complete-audit-fix.yml .github/workflows/apply-audit-fixes.yml
          git add lib .github/workflows/flutter-tests.yml
          git add -u .github/workflows/complete-audit-fix.yml .github/workflows/apply-audit-fixes.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: apply remaining audit fixes"
          git push
