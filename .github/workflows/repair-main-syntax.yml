name: repair-flutter-main-syntax

on: push

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix main.dart
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/main.dart')
          text = path.read_text()
          marker = "          ],\n        ),\n      ),\n    );\n  }\n\n  void _launchHtml5Game"
          fixed = "          ],\n        ),\n      ),\n    ),\n  );\n  }\n\n  void _launchHtml5Game"
          if marker not in text:
              raise SystemExit('Expected main.dart tail pattern not found')
          path.write_text(text.replace(marker, fixed, 1))
          PY
      - name: Commit and remove repair workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-main-syntax.yml
          git rm docs/ci-trigger.txt || true
          git add lib/main.dart
          git commit -m 'chore: repair Flutter main syntax'
          git push origin HEAD:main
