name: Repair auth logout integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch logout integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          if '_handleLogout()' not in s:
              marker = "  @override\n  Widget build(BuildContext context) {"
              insertion = '''  void _handleLogout() {\n    unawaited(_performLogout());\n  }\n\n  Future<void> _performLogout() async {\n    try {\n      if (TokenManager.token != null && TokenManager.token!.isNotEmpty) {\n        await ApiService.logout();\n      }\n    } catch (_) {\n      // Local logout must still complete if the backend is unavailable.\n    } finally {\n      await TokenManager.clearSession();\n      await SupabaseService.signOut();\n      if (!mounted) return;\n      setState(() {\n        _isLoggedIn = false;\n        _isProfilePageActive = false;\n        _isWithdrawPageActive = false;\n        _isSettingsPageActive = false;\n        _isTransactionsPageActive = false;\n        _isHelpCentrePageActive = false;\n        _isReportedIssuesPageActive = false;\n        _isAboutUsPageActive = false;\n        _isContactUsPageActive = false;\n        _isFairPlayPageActive = false;\n        _isHtml5GameActive = false;\n        _currentNavIndex = 0;\n        _depositBalance = 0.0;\n        _winningsBalance = 0.0;\n        _userName = 'Player';\n        _phoneNumber = '';\n        _currentAvatarPath = 'Assets/Avatar/avatar_1.png';\n        _transactionsList.clear();\n      });\n    }\n  }\n\n'''
              if marker not in s:
                  raise SystemExit('build marker not found')
              s = s.replace(marker, insertion + marker, 1)
          if 'onLogoutTap: _handleLogout,' not in s:
              marker = '                                          onFairPlayTap: () {\n'
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit('settings callback marker not found')
              # Insert immediately before the Fair Play callback to keep the Settings arguments grouped.
              s = s[:pos] + '                                          onLogoutTap: _handleLogout,\n' + s[pos:]
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          s = Path('lib/main.dart').read_text()
          for needle in ('void _handleLogout()', 'Future<void> _performLogout()', 'onLogoutTap: _handleLogout,'):
              assert needle in s, needle
          print('Auth/logout integration patch verified.')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart .github/workflows/repair-auth-logout.yml
          git rm .github/workflows/repair-auth-logout.yml
          git commit -m 'fix(auth): wire server logout into settings'
          git push origin HEAD:main
