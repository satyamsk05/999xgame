name: Fix Flutter lint
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-flutter-lint.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix return in finally
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          old = """    } finally {\n      await TokenManager.clearSession();\n      await SupabaseService.signOut();\n      if (!mounted) return;\n      setState(() {"""
          new = """    } finally {\n      await TokenManager.clearSession();\n      await SupabaseService.signOut();\n      if (!mounted) {\n        return;\n      }\n      setState(() {"""
          if old not in s:
              raise SystemExit('target pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git commit -m 'fix: satisfy Flutter finally control-flow lint'
          rm .github/workflows/fix-flutter-lint.yml
          git add .github/workflows/fix-flutter-lint.yml
          git commit -m 'chore: remove temporary lint repair workflow'
          git push origin HEAD:main
