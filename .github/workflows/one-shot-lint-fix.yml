name: One Shot Lint Fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/ci-trigger.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Flutter lint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          old = """    } finally {\n      await TokenManager.clearSession();\n      await SupabaseService.signOut();\n      if (!mounted) return;\n      setState(() {"""
          new = """    } finally {\n      await TokenManager.clearSession();\n      await SupabaseService.signOut();\n    }\n    if (!mounted) return;\n    setState(() {"""
          if old not in s:
              raise SystemExit('expected logout block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -f docs/ci-trigger.txt .github/workflows/one-shot-lint-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart docs/ci-trigger.txt .github/workflows/one-shot-lint-fix.yml
          git commit -m 'fix: satisfy Flutter logout lint' || exit 0
          git push origin HEAD:main
