name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Resolve production API URL
        env:
          SERVER_DOMAIN: ${{ secrets.SERVER_DOMAIN }}
        run: |
          if [ -z "$SERVER_DOMAIN" ]; then
            echo "SERVER_DOMAIN secret is not configured; using the repository's built-in API configuration."
          else
            case "$SERVER_DOMAIN" in
              https://*) ;;
              *) echo "SERVER_DOMAIN must use HTTPS for release builds."; exit 1 ;;
            esac
            echo "SERVER_DOMAIN=$SERVER_DOMAIN" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: |
          if [ -n "${SERVER_DOMAIN:-}" ]; then
            flutter build apk --release --dart-define=SERVER_DOMAIN="$SERVER_DOMAIN"
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ingames-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

# Always build the APK from the latest main commit after source fixes.
