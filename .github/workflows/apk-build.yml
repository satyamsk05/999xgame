name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Validate production API URL
        env:
          SERVER_DOMAIN: ${{ secrets.SERVER_DOMAIN }}
        run: |
          if [ -z "$SERVER_DOMAIN" ]; then
            echo "SERVER_DOMAIN GitHub Actions secret is required for release APK builds."
            exit 1
          fi
          case "$SERVER_DOMAIN" in
            https://*) ;;
            *) echo "SERVER_DOMAIN must use HTTPS for release builds."; exit 1 ;;
          esac

      - name: Build release APK
        env:
          SERVER_DOMAIN: ${{ secrets.SERVER_DOMAIN }}
        run: flutter build apk --release --dart-define=SERVER_DOMAIN="$SERVER_DOMAIN"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ingames-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

# Always build the APK from the latest main commit after source fixes.
