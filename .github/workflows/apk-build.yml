name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Resolve production API URL
        env:
          SERVER_DOMAIN: ${{ secrets.SERVER_DOMAIN }}
        run: |
          if [ -z "$SERVER_DOMAIN" ]; then
            echo "SERVER_DOMAIN secret is not configured; using the repository's built-in API configuration."
          else
            case "$SERVER_DOMAIN" in
              https://*) ;;
              *) echo "SERVER_DOMAIN must use HTTPS for release builds."; exit 1 ;;
            esac
            echo "SERVER_DOMAIN=$SERVER_DOMAIN" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: |
          if [ -n "${SERVER_DOMAIN:-}" ]; then
            flutter build apk --release --dart-define=SERVER_DOMAIN="$SERVER_DOMAIN"
          else
            flutter build apk --release
          fi

      - name: Sign CI APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found in the Android SDK." >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-unsigned.apk
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          rm -f build/app/outputs/flutter-apk/app-release-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ingames-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

# CI artifacts use an ephemeral debug certificate only to make test APKs installable.
# Production distribution must use a persistent dedicated release keystore.