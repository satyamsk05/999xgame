name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Resolve production API URL
        env:
          SERVER_DOMAIN: ${{ secrets.SERVER_DOMAIN }}
        run: |
          if [ -z "$SERVER_DOMAIN" ]; then
            echo "SERVER_DOMAIN secret is required for production release builds." >&2
            exit 1
          fi
          case "$SERVER_DOMAIN" in
            https://*) ;;
            *) echo "SERVER_DOMAIN must use HTTPS for release builds." >&2; exit 1 ;;
          esac
          echo "SERVER_DOMAIN=$SERVER_DOMAIN" >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release --dart-define=SERVER_DOMAIN="$SERVER_DOMAIN"

      - name: Validate production signing configuration
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name secret is required for production APK signing." >&2
              exit 1
            fi
          done

      - name: Sign production APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found in the Android SDK." >&2
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/ingames-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-unsigned.apk
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          rm -f build/app/outputs/flutter-apk/app-release-unsigned.apk "$KEYSTORE_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ingames-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

# Production signing requires a persistent dedicated release keystore stored in GitHub Secrets.
# Never commit the keystore, passwords, or signing credentials to the repository.