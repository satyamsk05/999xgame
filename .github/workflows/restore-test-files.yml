name: Restore game controller test files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.sha == '706bcc42531065acfc48362457942e7b1a4c76d8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch files
        run: |
          git checkout 5ddbc7cfd5f4c57282d3fc4169f155967ddffe17 -- backend/src/games/game.controller.js backend/tests/7updown_api.test.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/games/game.controller.js')
          s = p.read_text()
          old = "data: {\n        currentRound,\n        serverTime: new Date(now).toISOString(),"
          new = "data: {\n        gameId: 'seven_up_down',\n        roundId: currentRound.roundId,\n        currentRound,\n        serverTime: new Date(now).toISOString(),"
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('backend/tests/7updown_api.test.js')
          s = p.read_text()
          s = s.replace("const { signToken } = require('../src/auth/jwt');\n", "const { signToken } = require('../src/auth/jwt');\nconst { gameManager } = require('../src/games/game.manager');\nconst { sevenUpDownEngine } = require('../src/games/seven-up-down/engine');\n\nasync function waitForCurrentRound(timeoutMs = 8000) {\n  const deadline = Date.now() + timeoutMs;\n  while (Date.now() < deadline) {\n    if (sevenUpDownEngine.currentRound) return;\n    await new Promise((resolve) => setTimeout(resolve, 100));\n  }\n  throw new Error('7 Up Down worker did not create a current round within the test timeout.');\n}\n", 1)
          marker = "    try {\n      // 1. Setup authenticated user"
          replacement = "    try {\n      await gameManager.init(null);\n      await waitForCurrentRound();\n\n      // 1. Setup authenticated user"
          assert marker in s
          s = s.replace(marker, replacement, 1)
          s = s.replace("assert.ok(roundRes.body.data.roundId);", "assert.ok(roundRes.body.data.currentRound.roundId);", 1)
          s = s.replace("const roundId = roundRes.body.data.roundId;", "const roundId = roundRes.body.data.currentRound.roundId;", 1)
          s = s.replace("      server.close(done);", "      await gameManager.stopAll();\n      server.close(done);", 1)
          s = s.replace("      server.close();\n      done(err);", "      await gameManager.stopAll().catch(() => {});\n      server.close();\n      done(err);", 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/games/game.controller.js backend/tests/7updown_api.test.js
          git commit -m "Restore game controller and integration test"
          git push
