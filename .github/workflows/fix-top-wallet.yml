name: Fix Top Wallet Button

on:
  push:
    paths:
      - '.github/workflows/fix-top-wallet.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix wallet navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          old = """                              onAddMoneyPressed: () {\n                                setState(() {\n                                  _isProfilePageActive = true;\n                                });\n                              },"""
          new = """                              onAddMoneyPressed: () {\n                                setState(() {\n                                  _isProfilePageActive = false;\n                                  _isWithdrawPageActive = false;\n                                  _isSettingsPageActive = false;\n                                  _isTransactionsPageActive = false;\n                                  _currentNavIndex = 2;\n                                });\n                              },"""
          if old not in s:
              raise SystemExit('Expected wallet callback was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git rm .github/workflows/fix-top-wallet.yml
          git commit -m 'fix: route top wallet button to add cash'
          git push
