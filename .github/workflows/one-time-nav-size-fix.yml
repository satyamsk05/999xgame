name: One-time nav size fix

on:
  push:
    paths:
      - '.github/workflows/one-time-nav-size-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase nav icon size by 5 percent
        run: sed -i 's/size: 26,/size: 27.3,/g' lib/widgets/bottom_nav_bar.dart
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No change needed'
          else
            git add lib/widgets/bottom_nav_bar.dart
            git commit -m 'fix: increase bottom nav icons by 5 percent'
            git push
          fi
