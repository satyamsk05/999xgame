name: One-time nav size fix

on:
  push:
    paths:
      - '.github/workflows/one-time-nav-size-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final nav fix
        run: |
          sed -i 's/size: 26,/size: 27.3,/g' lib/widgets/bottom_nav_bar.dart
          sed -i 's/16\.8851/16.4930/g' lib/widgets/bottom_nav_bar.dart
          rm .github/workflows/one-time-nav-size-fix.yml
      - name: Commit final change and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/one-time-nav-size-fix.yml lib/widgets/bottom_nav_bar.dart .github/workflows/one-time-nav-size-fix.yml 2>/dev/null || true
          git add -A
          git commit -m 'fix: finalize bottom nav icon size'
          git push
# final trigger
