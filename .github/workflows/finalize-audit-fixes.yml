name: Finalize audit fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('lib/screens/login_screen.dart')
          s = p.read_text()
          verify_pattern = r"(?P<indent>\s*)\}\s*catch \(e\) \{\s*// Log error for debugging \(visible in flutter logs\)\s*debugPrint\('\[LoginVerify\] Error in verification loop: \$e'\);\s*await Future\.delayed\(const Duration\(milliseconds: 1500\)\);\s*\}"
          verify_replacement = '''\\g<indent>} catch (e) {\n\\g<indent>  // Fail closed on permanent/authentication errors.\n\\g<indent>  if (e is ApiException) {\n\\g<indent>    const retryableStatuses = <int>{0, 408, 429, 500, 502, 503, 504};\n\\g<indent>    final status = e.statusCode ?? 0;\n\\g<indent>    if (!retryableStatuses.contains(status)) {\n\\g<indent>      _isVerifyingActive = false;\n\\g<indent>      if (mounted) {\n\\g<indent>        setState(() {\n\\g<indent>          _isLoading = false;\n\\g<indent>          _statusMessage = null;\n\\g<indent>          _errorMessage = e.message;\n\\g<indent>          _currentStep = 0;\n\\g<indent>        });\n\\g<indent>      }\n\\g<indent>      return;\n\\g<indent>    }\n\\g<indent>  }\n\\g<indent>  debugPrint('[LoginVerify] transient error: $e');\n\\g<indent>  await Future.delayed(const Duration(milliseconds: 1500));\n\\g<indent>}'''
          s2, n = re.subn(verify_pattern, verify_replacement, s, count=1)
          if n != 1: raise SystemExit(f'login verification patch count={n}')

          onboarding_pattern = r"(?P<indent>\s*)\}\s*catch \(_\) \{\s*// Non-fatal: proceed even if API call fails\s*\}\s*(?=if \(mounted\) \{)"
          onboarding_replacement = '''\\g<indent>} catch (e) {\n\\g<indent>  // Onboarding persistence is authoritative; fail closed on error.\n\\g<indent>  if (mounted) {\n\\g<indent>    setState(() {\n\\g<indent>      _isLoading = false;\n\\g<indent>      _errorMessage = e is ApiException ? e.message : 'Could not complete setup. Please try again.';\n\\g<indent>    });\n\\g<indent>  }\n\\g<indent>  return;\n\\g<indent>}\n\n'''
          s3, n = re.subn(onboarding_pattern, onboarding_replacement, s2, count=1)
          if n != 1: raise SystemExit(f'onboarding patch count={n}')
          p.write_text(s3)

          p = Path('lib/main.dart')
          s = p.read_text().replace("import 'dart:io';\n", '', 1)
          monitor_pattern = r"(?s)  void _startNetworkMonitoring\(\) \{.*?\n  \}\n\n  Future<void> _fetchUserData"
          monitor_replacement = '''  void _startNetworkMonitoring() {\n    _networkPingTimer?.cancel();\n    _networkPingTimer = Timer.periodic(const Duration(seconds: 8), (timer) async {\n      if (!mounted || !_isLoggedIn) return;\n      final ready = await ApiService.isBackendReady(timeout: const Duration(seconds: 4));\n      if (!mounted) return;\n      if (ready) {\n        if (_isOffline) {\n          setState(() => _isOffline = false);\n          _fetchUserData();\n        }\n      } else if (!_isOffline) {\n        setState(() => _isOffline = true);\n      }\n    });\n  }\n\n  Future<void> _fetchUserData'''
          s2, n = re.subn(monitor_pattern, monitor_replacement, s, count=1)
          if n != 1: raise SystemExit(f'network monitor patch count={n}')
          p.write_text(s2)

          m = Path('lib/core/money/money_paise.dart')
          m.parent.mkdir(parents=True, exist_ok=True)
          m.write_text('''/// Exact monetary value represented as integer paise.\nclass MoneyPaise {\n  const MoneyPaise(this.value);\n  final int value;\n  factory MoneyPaise.fromRupees(num rupees) {\n    if (!rupees.isFinite || rupees < 0) throw ArgumentError.value(rupees, 'rupees');\n    final scaled = rupees * 100;\n    if (scaled.roundToDouble() != scaled) throw ArgumentError.value(rupees, 'rupees', 'at most two decimal places');\n    return MoneyPaise(scaled.toInt());\n  }\n  double get rupees => value / 100.0;\n  String get decimalString => (value / 100).toStringAsFixed(2);\n  Map<String, dynamic> toJson() => {'amountPaise': value};\n  @override bool operator ==(Object other) => other is MoneyPaise && other.value == value;\n  @override int get hashCode => value.hashCode;\n}\n''')

          p = Path('lib/features/wallet/data/wallet_api.dart')
          s = p.read_text()
          if 'money_paise.dart' not in s:
            s = s.replace("import '../../../core/api/api_client.dart';", "import '../../../core/api/api_client.dart';\nimport '../../../core/money/money_paise.dart';", 1)
          typed = '''\n  static Future<Map<String, dynamic>> createDepositOrderPaise({required MoneyPaise amount, String paymentMethod = 'UPI'}) async {\n    final res = await ApiClient.post('/deposits', {'amount': amount.rupees, 'amountPaise': amount.value, 'paymentMethod': paymentMethod});\n    return res as Map<String, dynamic>;\n  }\n\n  static Future<Map<String, dynamic>> withdrawCashPaise({required MoneyPaise amount, required String upiId, String? idempotencyKey}) async {\n    final res = await ApiClient.post('/withdrawals', {'amount': amount.rupees, 'amountPaise': amount.value, 'upiId': upiId, 'idempotencyKey': idempotencyKey});\n    return res as Map<String, dynamic>;\n  }\n'''
          if 'createDepositOrderPaise' not in s:
            s = s.replace('class WalletApi {', 'class WalletApi {' + typed, 1)
          p.write_text(s)

      - name: Add Flutter CI and clean temporary workflows
        shell: bash
        run: |
          cat > .github/workflows/flutter-tests.yml <<'EOF'
          name: Flutter checks
          on:
            push:
              branches: [main]
            pull_request:
          jobs:
            analyze:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: '3.41.0'
                    channel: stable
                    cache: true
                - run: flutter pub get
                - run: flutter analyze
                - run: flutter test
          EOF
          rm -f .github/workflows/complete-audit-fix.yml .github/workflows/apply-audit-fixes.yml .github/workflows/finalize-audit-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib .github/workflows/flutter-tests.yml
          git add -u .github/workflows/complete-audit-fix.yml .github/workflows/apply-audit-fixes.yml .github/workflows/finalize-audit-fixes.yml
          git commit -m 'chore: apply remaining audit fixes'
          git push
